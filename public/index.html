<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jagat Pharma CRM</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;background:#f5f6fa;color:#1a1a2e}
.header{background:#fff;border-bottom:1px solid #e8eaed;padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.brand{display:flex;align-items:center;gap:10px}
.brand-logo{width:32px;height:32px;border-radius:8px;background:#0F6E56;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:700}
.brand-name{font-size:15px;font-weight:600;color:#1a1a2e}
.brand-sub{font-size:11px;color:#888}
.header-actions{display:flex;gap:8px}
.btn{padding:7px 14px;border-radius:8px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;font-weight:500;transition:all .15s}
.btn-outline{background:#fff;border:1px solid #dde1e7;color:#444}
.btn-outline:hover{background:#f5f6fa}
.btn-primary{background:#0F6E56;border:1px solid #0F6E56;color:#fff}
.btn-primary:hover{background:#085041}
.btn-danger{background:#fff;border:1px solid #fca5a5;color:#dc2626}
.btn-danger:hover{background:#fef2f2}
.main{max-width:1200px;margin:0 auto;padding:20px 24px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat{background:#fff;border-radius:10px;border:1px solid #e8eaed;padding:14px 16px}
.stat-label{font-size:11px;color:#888;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.stat-val{font-size:24px;font-weight:600}
.stat-val.green{color:#0F6E56}.stat-val.amber{color:#92400e}.stat-val.gray{color:#555}.stat-val.blue{color:#1e40af}
.toolbar{background:#fff;border:1px solid #e8eaed;border-radius:10px;padding:12px 16px;display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.search-wrap{flex:1;min-width:200px;position:relative}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#aaa}
.search-wrap input{width:100%;padding:7px 10px 7px 32px;border:1px solid #dde1e7;border-radius:7px;font-size:13px;background:#f9fafb;color:#1a1a2e}
.search-wrap input:focus{outline:none;border-color:#0F6E56;background:#fff}
select{padding:7px 10px;border:1px solid #dde1e7;border-radius:7px;font-size:13px;background:#f9fafb;color:#1a1a2e;cursor:pointer}
select:focus{outline:none;border-color:#0F6E56}
.table-wrap{background:#fff;border:1px solid #e8eaed;border-radius:10px;overflow:hidden}
table{width:100%;border-collapse:collapse}
th{font-size:11px;font-weight:600;color:#888;text-align:left;padding:10px 14px;border-bottom:1px solid #e8eaed;background:#fafbfc;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid #f0f2f5;font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#f9fafb;cursor:pointer}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600}
.badge-new{background:#dcfce7;color:#166534}
.badge-follow{background:#fef3c7;color:#92400e}
.badge-closed{background:#f1f5f9;color:#475569}
.badge-bs{background:#dbeafe;color:#1e40af}
.badge-kw{background:#fce7f3;color:#9d174d}
.badge-team{background:#d1fae5;color:#065f46}
.wa-btn{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:6px;font-size:12px;font-weight:500;background:#0F6E56;color:#fff;text-decoration:none;border:none;cursor:pointer;transition:background .15s}
.wa-btn:hover{background:#085041}
.empty{text-align:center;padding:48px 20px;color:#aaa}
.empty svg{margin:0 auto 12px;display:block;opacity:.3}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:100;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:12px;width:500px;max-width:95vw;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.modal-header{padding:16px 20px;border-bottom:1px solid #e8eaed;display:flex;align-items:center;justify-content:space-between}
.modal-header h3{font-size:15px;font-weight:600}
.modal-body{padding:20px}
.field-group{margin-bottom:14px}
.field-label{font-size:12px;font-weight:500;color:#555;margin-bottom:5px}
.field-input{width:100%;padding:8px 11px;border:1px solid #dde1e7;border-radius:7px;font-size:13px;color:#1a1a2e;background:#fff}
.field-input:focus{outline:none;border-color:#0F6E56}
textarea.field-input{resize:vertical;min-height:80px}
.modal-footer{padding:12px 20px;border-top:1px solid #e8eaed;display:flex;gap:8px;justify-content:flex-end}
.detail-grid{display:grid;grid-template-columns:90px 1fr;gap:8px 12px;margin-bottom:16px}
.detail-key{font-size:12px;color:#888;padding-top:2px}
.detail-val{font-size:13px}
.notes-list{margin-bottom:12px}
.note-item{background:#f9fafb;border-radius:7px;padding:9px 11px;margin-bottom:6px}
.note-meta{font-size:11px;color:#aaa;margin-bottom:3px}
.note-text{font-size:13px;color:#444}
.add-note-row{display:flex;gap:6px}
.add-note-row input{flex:1;padding:7px 10px;border:1px solid #dde1e7;border-radius:7px;font-size:13px}
.add-note-row input:focus{outline:none;border-color:#0F6E56}
.section-title{font-size:12px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.divider{border:none;border-top:1px solid #e8eaed;margin:14px 0}
.toast{position:fixed;bottom:24px;right:24px;background:#1a1a2e;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.loading{text-align:center;padding:32px;color:#aaa;font-size:13px}
.conn-status{display:flex;align-items:center;gap:6px;font-size:12px;color:#888}
.conn-dot{width:7px;height:7px;border-radius:50%;background:#0F6E56}
.conn-dot.red{background:#dc2626}
</style>
</head>
<body>

<div class="header">
  <div class="brand">
    <div class="brand-logo">JP</div>
    <div>
      <div class="brand-name">Jagat Pharma CRM</div>
      <div class="brand-sub">WhatsApp Lead Management</div>
    </div>
  </div>
  <div class="header-actions">
    <div class="conn-status"><div class="conn-dot" id="conn-dot"></div><span id="conn-text">Connecting...</span></div>
    <button class="btn btn-outline" onclick="exportCSV()">⬇ Export CSV</button>
    <button class="btn btn-primary" onclick="openAddModal()">+ Add Lead</button>
  </div>
</div>

<div class="main">
  <div class="stats" id="stats">
    <div class="stat"><div class="stat-label">Total Leads</div><div class="stat-val blue" id="s-total">—</div></div>
    <div class="stat"><div class="stat-label">New</div><div class="stat-val green" id="s-new">—</div></div>
    <div class="stat"><div class="stat-label">Follow-up</div><div class="stat-val amber" id="s-follow">—</div></div>
    <div class="stat"><div class="stat-label">Closed</div><div class="stat-val gray" id="s-closed">—</div></div>
  </div>

  <div class="toolbar">
    <div class="search-wrap">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="search" placeholder="Search by name or number…" oninput="loadLeads()">
    </div>
    <select id="filterStatus" onchange="loadLeads()">
      <option value="">All Statuses</option>
      <option>New</option><option>Follow-up</option><option>Closed</option>
    </select>
    <select id="filterSource" onchange="loadLeads()">
      <option value="">All Sources</option>
      <option>Bitespeed</option><option>Kwikengage</option><option>Team</option>
    </select>
    <button class="btn btn-outline" onclick="loadLeads()">↻ Refresh</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th><th>Name</th><th>Phone</th><th>Query</th><th>Source</th><th>Date & Time</th><th>Status</th><th>Action</th>
        </tr>
      </thead>
      <tbody id="leads-body">
        <tr><td colspan="8" class="loading">Loading leads...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Add Lead Modal -->
<div class="modal-bg" id="modal-add">
  <div class="modal">
    <div class="modal-header">
      <h3>Add Lead Manually</h3>
      <button class="btn btn-outline" style="padding:4px 8px" onclick="closeModal('modal-add')">✕</button>
    </div>
    <div class="modal-body">
      <div class="field-group"><div class="field-label">Name</div><input class="field-input" id="add-name" placeholder="Customer name"></div>
      <div class="field-group"><div class="field-label">Phone Number *</div><input class="field-input" id="add-phone" placeholder="+91 98765 43210"></div>
      <div class="field-group"><div class="field-label">Query / Message</div><textarea class="field-input" id="add-query" placeholder="What did they ask?"></textarea></div>
      <div class="field-group"><div class="field-label">WhatsApp Source</div>
        <select class="field-input" id="add-source">
          <option>Bitespeed</option><option>Kwikengage</option><option>Team</option>
        </select>
      </div>
      <div class="field-group"><div class="field-label">Status</div>
        <select class="field-input" id="add-status">
          <option>New</option><option>Follow-up</option><option>Closed</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('modal-add')">Cancel</button>
      <button class="btn btn-primary" onclick="saveLead()">Save Lead</button>
    </div>
  </div>
</div>

<!-- Detail Modal -->
<div class="modal-bg" id="modal-detail">
  <div class="modal">
    <div class="modal-header">
      <h3 id="detail-title">Lead Details</h3>
      <button class="btn btn-outline" style="padding:4px 8px" onclick="closeModal('modal-detail')">✕</button>
    </div>
    <div class="modal-body" id="detail-body"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = 'https://jagat-pharma-crm-production.up.railway.app/api';
let allLeads = [];

function sourceBadge(s){
  const map={Bitespeed:'badge-bs',Kwikengage:'badge-kw',Team:'badge-team'};
  return `<span class="badge ${map[s]||'badge-team'}">${s}</span>`;
}
function statusBadge(s){
  const map={'New':'badge-new','Follow-up':'badge-follow','Closed':'badge-closed'};
  return `<span class="badge ${map[s]||'badge-new'}">${s}</span>`;
}
function fmtTime(iso){
  const d=new Date(iso);
  return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'2-digit'})+' '+d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true});
}
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

async function loadLeads(){
  const search=document.getElementById('search').value;
  const status=document.getElementById('filterStatus').value;
  const source=document.getElementById('filterSource').value;
  const params=new URLSearchParams();
  if(search) params.set('search',search);
  if(status) params.set('status',status);
  if(source) params.set('source',source);

  try{
    const r=await fetch(`${API}/leads?${params}`);
    allLeads=await r.json();
    renderLeads();
    renderStats();
    setConn(true);
  }catch(e){
    setConn(false);
    document.getElementById('leads-body').innerHTML='<tr><td colspan="8" class="loading">⚠ Cannot connect to server. Make sure npm run dev is running.</td></tr>';
  }
}

function renderLeads(){
  const tbody=document.getElementById('leads-body');
  if(!allLeads.length){
    tbody.innerHTML='<tr><td colspan="8" class="empty">No leads found</td></tr>';
    return;
  }
  tbody.innerHTML=allLeads.map((l,i)=>`
    <tr onclick="openDetail(${l.id})">
      <td style="color:#aaa;font-size:12px">${l.id}</td>
      <td style="font-weight:500">${l.name||'Unknown'}</td>
      <td style="font-family:monospace;font-size:12px">${l.phone}</td>
      <td style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#555" title="${l.query}">${l.query||'—'}</td>
      <td>${sourceBadge(l.source)}</td>
      <td style="font-size:12px;color:#888;white-space:nowrap">${fmtTime(l.received_at)}</td>
      <td>${statusBadge(l.status)}</td>
      <td><a class="wa-btn" href="https://wa.me/${l.phone.replace(/\D/g,'')}" onclick="event.stopPropagation()" target="_blank">💬 Reply</a></td>
    </tr>
  `).join('');
}

function renderStats(){
  document.getElementById('s-total').textContent=allLeads.length;
  document.getElementById('s-new').textContent=allLeads.filter(l=>l.status==='New').length;
  document.getElementById('s-follow').textContent=allLeads.filter(l=>l.status==='Follow-up').length;
  document.getElementById('s-closed').textContent=allLeads.filter(l=>l.status==='Closed').length;
}

function setConn(ok){
  document.getElementById('conn-dot').className='conn-dot'+(ok?'':' red');
  document.getElementById('conn-text').textContent=ok?'Live':'Disconnected';
}

async function openDetail(id){
  try{
    const r=await fetch(`${API}/leads/${id}`);
    const l=await r.json();
    document.getElementById('detail-title').textContent=l.name||'Lead Details';
    document.getElementById('detail-body').innerHTML=`
      <div class="detail-grid">
        <div class="detail-key">Name</div><div class="detail-val">${l.name||'—'}</div>
        <div class="detail-key">Phone</div><div class="detail-val"><a href="https://wa.me/${l.phone.replace(/\D/g,'')}" target="_blank" style="color:#0F6E56">${l.phone}</a></div>
        <div class="detail-key">Query</div><div class="detail-val" style="white-space:normal">${l.query||'—'}</div>
        <div class="detail-key">Source</div><div class="detail-val">${sourceBadge(l.source)}</div>
        <div class="detail-key">Received</div><div class="detail-val">${fmtTime(l.received_at)}</div>
        <div class="detail-key">Status</div><div class="detail-val">
          <select onchange="updateStatus(${l.id},this.value)" style="padding:5px 8px;border:1px solid #dde1e7;border-radius:6px;font-size:12px;background:#fff">
            <option ${l.status==='New'?'selected':''}>New</option>
            <option ${l.status==='Follow-up'?'selected':''}>Follow-up</option>
            <option ${l.status==='Closed'?'selected':''}>Closed</option>
          </select>
        </div>
      </div>
      <hr class="divider">
      <div class="section-title">Follow-up Notes</div>
      <div class="notes-list" id="notes-${l.id}">
        ${l.notes.length?l.notes.map(n=>`
          <div class="note-item">
            <div class="note-meta">${fmtTime(n.created_at)}</div>
            <div class="note-text">${n.text}</div>
          </div>`).join(''):'<div style="font-size:12px;color:#aaa;margin-bottom:8px">No notes yet</div>'}
      </div>
      <div class="add-note-row">
        <input id="note-inp-${l.id}" placeholder="Add follow-up note…" onkeydown="if(event.key==='Enter')addNote(${l.id})">
        <button class="btn btn-primary" style="padding:6px 12px" onclick="addNote(${l.id})">Add</button>
      </div>
      <hr class="divider">
      <a class="wa-btn" href="https://wa.me/${l.phone.replace(/\D/g,'')}" target="_blank">💬 Open in WhatsApp</a>
    `;
    document.getElementById('modal-detail').classList.add('open');
  }catch(e){toast('Failed to load lead details');}
}

async function updateStatus(id,status){
  await fetch(`${API}/leads/${id}/status`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});
  toast('Status updated');
  loadLeads();
}

async function addNote(id){
  const inp=document.getElementById(`note-inp-${id}`);
  const text=inp.value.trim();
  if(!text) return;
  await fetch(`${API}/leads/${id}/notes`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});
  inp.value='';
  const r=await fetch(`${API}/leads/${id}`);
  const l=await r.json();
  document.getElementById(`notes-${id}`).innerHTML=l.notes.map(n=>`
    <div class="note-item">
      <div class="note-meta">${fmtTime(n.created_at)}</div>
      <div class="note-text">${n.text}</div>
    </div>`).join('');
  toast('Note added');
}

function openAddModal(){document.getElementById('modal-add').classList.add('open');}
function closeModal(id){document.getElementById(id).classList.remove('open');}

async function saveLead(){
  const phone=document.getElementById('add-phone').value.trim();
  if(!phone){toast('Phone number is required');return;}
  const body={
    name:document.getElementById('add-name').value.trim(),
    phone,
    query:document.getElementById('add-query').value.trim(),
    source:document.getElementById('add-source').value,
    status:document.getElementById('add-status').value
  };
  await fetch(`${API}/leads`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  closeModal('modal-add');
  ['add-name','add-phone','add-query'].forEach(i=>document.getElementById(i).value='');
  toast('Lead added!');
  loadLeads();
}

function exportCSV(){
  if(!allLeads.length){toast('No leads to export');return;}
  const rows=[['ID','Name','Phone','Query','Source','Status','Received'],...allLeads.map(l=>[l.id,l.name,l.phone,l.query,l.source,l.status,fmtTime(l.received_at)])];
  const csv=rows.map(r=>r.map(c=>'"'+(String(c||'')).replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,\uFEFF'+encodeURIComponent(csv);
  a.download='jagat_leads_'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
  toast('CSV exported!');
}

document.querySelectorAll('.modal-bg').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('open');}));

// Auto-refresh every 30 seconds
loadLeads();
setInterval(loadLeads, 30000);
</script>
</body>
</html>
